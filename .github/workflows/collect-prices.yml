name: Collect market prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_prices.py"
      - ".github/workflows/collect-prices.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test collector
        run: python scripts/collect_prices.py --self-test
      - name: Sync latest main before collection
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Collect prices
        run: python scripts/collect_prices.py
      - name: Commit market data
        run: |
          git config user.name "karen-fuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          if [ -f data/consensus_history.json ]; then git add data/consensus_history.json; fi
          if [ -f data/tgju_history.json ]; then git add data/tgju_history.json; fi
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update market snapshot"
          git push
