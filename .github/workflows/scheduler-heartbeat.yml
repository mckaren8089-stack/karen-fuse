name: Scheduler heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler heartbeat
        run: |
          echo "scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
