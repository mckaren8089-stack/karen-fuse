name: Quality checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
    paths:
      - "app.js"
      - "index.html"
      - "style.css"
      - "sw.js"
      - "scripts/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Check collector syntax
        run: python -m py_compile scripts/collect_prices.py
      - name: Run collector self-test
        run: python scripts/collect_prices.py --self-test
